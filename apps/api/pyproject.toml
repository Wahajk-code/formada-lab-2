[project]
name = "formada-api"
version = "0.1.0"
description = "Formada API: business rules, data, RLS, internal endpoints for n8n"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.115",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "openai>=3.39.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "snowflake-connector-python==4.8.1",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Local-only mock seeds (gitignored) are not part of the checked code.
extend-exclude = ["seed/private"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Applied migrations are history: long SQL lines stay as they were.
"migrations/versions/*" = ["E501"]

[tool.ruff.format]
exclude = ["migrations/versions/*"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
