key: supplier_fill_rate
version: 1
playbook: purchasing
description: >
  Share of ordered units actually received, per supplier and receipt week (short shipments pull
  it down). Driver: each supplier's open order exposure (lines, POs, units still to receive).
archetypes:
  pol: purchase_order_line
params:
  weeks: { type: integer, default: 26, minimum: 14, maximum: 104 }
sql: |
  select {{pol.supplier_name}} as entity,
         date_trunc('week', {{pol.received_at}})::date as period_start,
         round(100 * sum({{pol.qty_received}}) / nullif(sum({{pol.qty_ordered}}), 0), 2) as value,
         count(*) as n
  from ({{pol}}) as pol
  where {{pol.received_at}} is not null
    and {{pol.received_at}} > dateadd('week', -%(weeks)s, %(period_end)s::date)
    and {{pol.received_at}} <= %(period_end)s::date
  group by 1, 2
  order by 1, 2
  limit %(row_cap)s
drivers:
  open_orders:
    exposure: open_lines
    sql: |
      select {{pol.supplier_name}} as entity,
             count(*) as open_lines,
             count(distinct {{pol.po_id}}) as open_pos,
             sum({{pol.qty_ordered}}) as units_on_order
      from ({{pol}}) as pol
      where {{pol.received_at}} is null
        and {{pol.ordered_at}} <= %(period_end)s::date
      group by 1
      order by 1
      limit %(row_cap)s
