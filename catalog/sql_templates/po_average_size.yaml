key: po_average_size
version: 1
playbook: purchasing
description: >
  Average units per purchase order, per supplier and order week. Many small orders cost more
  freight and handling per unit. Driver: the supplier's order count over the window.
archetypes:
  po: purchase_order
params:
  weeks: { type: integer, default: 26, minimum: 14, maximum: 104 }
sql: |
  select {{po.supplier_name}} as entity,
         date_trunc('week', {{po.ordered_at}})::date as period_start,
         round(sum({{po.units_ordered}}) / nullif(count(*), 0), 2) as value,
         count(*) as n
  from ({{po}}) as po
  where {{po.ordered_at}} > dateadd('week', -%(weeks)s, %(period_end)s::date)
    and {{po.ordered_at}} <= %(period_end)s::date
  group by 1, 2
  order by 1, 2
  limit %(row_cap)s
drivers:
  orders:
    exposure: orders
    sql: |
      select {{po.supplier_name}} as entity, count(*) as orders,
             sum({{po.units_ordered}}) as units
      from ({{po}}) as po
      where {{po.ordered_at}} > dateadd('week', -13, %(period_end)s::date)
        and {{po.ordered_at}} <= %(period_end)s::date
      group by 1
      order by 1
      limit %(row_cap)s
