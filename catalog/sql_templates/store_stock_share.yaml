key: store_stock_share
version: 1
playbook: inventory
description: >
  Each store's share of the stock value held across all stores, per week (last snapshot of the
  week). A share removes the season that fills every store at once and ignores warehouse
  moves, so a store piling up stock shows. Driver: the stores' total stock value now (exposure).
archetypes:
  inv: inventory_snapshot
params:
  weeks: { type: integer, default: 20, minimum: 14, maximum: 52 }
sql: |
  with week_end as (
    select date_trunc('week', {{inv.snapshot_date}})::date as week_start,
           max({{inv.snapshot_date}}) as snap
    from ({{inv}}) as inv
    where {{inv.snapshot_date}} > dateadd('week', -%(weeks)s, %(period_end)s::date)
      and {{inv.snapshot_date}} <= %(period_end)s::date
    group by 1
  ), by_store as (
    select w.week_start, {{inv.location_name}} as entity,
           sum({{inv.on_hand_value}}) as stock_value, count(*) as n
    from ({{inv}}) as inv
    join week_end w on {{inv.snapshot_date}} = w.snap
    where {{inv.location_kind}} = 'store'
    group by 1, 2
  )
  select entity, week_start as period_start,
         round(100 * stock_value / nullif(sum(stock_value) over (partition by week_start), 0), 3)
           as value,
         n
  from by_store
  order by 1, 2
  limit %(row_cap)s
drivers:
  store_stock:
    exposure: stores_stock_value
    sql: |
      with last_snap as (
        select max({{inv.snapshot_date}}) as snap
        from ({{inv}}) as inv
        where {{inv.snapshot_date}} <= %(period_end)s::date
      ), by_store as (
        select {{inv.location_name}} as entity, sum({{inv.on_hand_value}}) as store_value
        from ({{inv}}) as inv
        join last_snap l on {{inv.snapshot_date}} = l.snap
        where {{inv.location_kind}} = 'store'
        group by 1
      )
      select entity, round(store_value, 2) as store_value,
             round(sum(store_value) over (), 2) as stores_stock_value
      from by_store
      order by 1
      limit %(row_cap)s
