key: po_volume
version: 2
playbook: purchasing
description: >
  Purchase orders placed per supplier and week. A sudden jump or drop means a buying pattern changed. Driver: the supplier's orders over the last 13 weeks.
archetypes:
  po: purchase_order
params:
  weeks: { type: integer, default: 26, minimum: 14, maximum: 104 }
sql: |
  select {{po.supplier_name}} as entity,
         date_trunc('week', {{po.ordered_at}})::date as period_start,
         count(distinct {{po.po_id}}) as value,
         count(*) as n
  from ({{po}}) as po
  where {{po.ordered_at}} > dateadd('week', -%(weeks)s, %(period_end)s::date)
    and {{po.ordered_at}} <= %(period_end)s::date
  group by 1, 2
  order by 1, 2
  limit %(row_cap)s
drivers:
  orders:
    exposure: null
    sql: |
      select {{po.supplier_name}} as entity, count(distinct {{po.po_id}}) as orders
      from ({{po}}) as po
      where {{po.ordered_at}} > dateadd('week', -13, %(period_end)s::date)
        and {{po.ordered_at}} <= %(period_end)s::date
      group by 1
      order by 1
      limit %(row_cap)s
