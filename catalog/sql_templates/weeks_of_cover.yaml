key: weeks_of_cover
version: 2
playbook: purchasing
description: >
  Weeks of stock cover per style-colour (on hand / average weekly units sold over the trailing
  4 weeks), per week. High cover ties up cash. Driver: units and cost value on hand now.
archetypes:
  inv: inventory_position
  sl: sales_line
params:
  weeks: { type: integer, default: 16, minimum: 14, maximum: 52 }
  min_on_hand: { type: integer, default: 40 }
sql: |
  with stock as (
    select {{inv.style_colour}} as entity, {{inv.snapshot_date}}::date as week_end,
           sum({{inv.on_hand_units}}) as on_hand
    from ({{inv}}) as inv
    where {{inv.snapshot_date}} > dateadd('week', -%(weeks)s, %(period_end)s::date)
      and {{inv.snapshot_date}} <= %(period_end)s::date
    group by 1, 2
  ), sold as (
    select inv.entity, inv.week_end, sum({{sl.units_sold}}) / 4.0 as weekly_units
    from stock inv
    join ({{sl}}) as sl
      on {{sl.style_colour}} = inv.entity
     and {{sl.sale_date}} > dateadd('day', -28, inv.week_end)
     and {{sl.sale_date}} <= inv.week_end
    group by 1, 2
  )
  select s.entity, dateadd('day', -6, s.week_end)::date as period_start,
         round(s.on_hand / greatest(coalesce(d.weekly_units, 0), 0.5), 2) as value,
         s.on_hand as n
  from stock s left join sold d on d.entity = s.entity and d.week_end = s.week_end
  where s.entity in (select entity from stock where week_end = (select max(week_end) from stock)
                     and on_hand >= %(min_on_hand)s)
  group by s.entity, s.week_end, s.on_hand, d.weekly_units
  order by s.entity, period_start
  limit %(row_cap)s
drivers:
  stock_value:
    exposure: on_hand_units
    sql: |
      select {{inv.style_colour}} as entity, sum({{inv.on_hand_units}}) as on_hand_units
      from ({{inv}}) as inv
      where {{inv.snapshot_date}} = (select max({{inv.snapshot_date}}) from ({{inv}}) as i2
                                     where {{inv.snapshot_date}} <= %(period_end)s::date)
      group by 1
      order by 1
      limit %(row_cap)s
