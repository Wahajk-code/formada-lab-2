key: stale_stock_value
version: 2
playbook: inventory
description: >
  Stock value per location whose available quantity has not moved for stale_days or more, per
  week (last snapshot of the week). Only weeks where the customer tracks the last-movement date
  count. Stale stock ties up cash and ends in markdowns or write-offs. Driver: the location's
  total stock value now. v2 adds the largest stale items at each location with how many days
  they have not moved, so a card can name what to transfer, bundle or mark down.
archetypes:
  inv: inventory_snapshot
params:
  weeks: { type: integer, default: 20, minimum: 4, maximum: 52 }
  stale_days: { type: integer, default: 90, minimum: 30, maximum: 365 }
sql: |
  with week_end as (
    select date_trunc('week', {{inv.snapshot_date}})::date as week_start,
           max({{inv.snapshot_date}}) as snap
    from ({{inv}}) as inv
    where {{inv.snapshot_date}} > dateadd('week', -%(weeks)s, %(period_end)s::date)
      and {{inv.snapshot_date}} <= %(period_end)s::date
    group by 1
  )
  select {{inv.location_name}} as entity, w.week_start as period_start,
         round(sum(case when {{inv.on_hand_units}} > 0
                         and {{inv.last_movement_date}} <= dateadd('day', -%(stale_days)s, w.snap)
                        then {{inv.on_hand_value}} else 0 end), 2) as value,
         count({{inv.last_movement_date}}) as n
  from ({{inv}}) as inv
  join week_end w on {{inv.snapshot_date}} = w.snap
  where {{inv.location_kind}} in ('store', 'warehouse')
  group by 1, 2
  having count({{inv.last_movement_date}}) > 0
  order by 1, 2
  limit %(row_cap)s
drivers:
  location_stock:
    exposure: null
    sql: |
      with last_snap as (
        select max({{inv.snapshot_date}}) as snap
        from ({{inv}}) as inv
        where {{inv.snapshot_date}} <= %(period_end)s::date
      )
      select {{inv.location_name}} as entity, round(sum({{inv.on_hand_value}}), 2) as stock_value,
             count(*) as item_lines
      from ({{inv}}) as inv
      join last_snap l on {{inv.snapshot_date}} = l.snap
      where {{inv.location_kind}} in ('store', 'warehouse')
      group by 1
      order by 1
      limit %(row_cap)s
  top_items:
    kind: top_items
    exposure: null
    sql: |
      with last_snap as (
        select max({{inv.snapshot_date}}) as snap
        from ({{inv}}) as inv
        where {{inv.snapshot_date}} <= %(period_end)s::date
      ), items as (
        select {{inv.location_name}} as entity, {{inv.item_name}} as item,
               max({{inv.vendor_name}}) as vendor,
               round(sum({{inv.on_hand_value}}), 2) as stale_value,
               max(datediff('day', {{inv.last_movement_date}}, l.snap)) as days_without_movement
        from ({{inv}}) as inv
        join last_snap l on {{inv.snapshot_date}} = l.snap
        where {{inv.location_kind}} in ('store', 'warehouse')
          and {{inv.on_hand_units}} > 0
          and {{inv.last_movement_date}} <= dateadd('day', -%(stale_days)s, l.snap)
        group by 1, 2
      ), ranked as (
        select entity, item, vendor, stale_value, days_without_movement,
               row_number() over (partition by entity order by stale_value desc) as rank
        from items
      )
      select entity, item, vendor, stale_value, days_without_movement
      from ranked
      where rank <= %(top_n)s
      order by 1, 4 desc
      limit %(row_cap)s
