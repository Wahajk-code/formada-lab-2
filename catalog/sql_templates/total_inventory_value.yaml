key: total_inventory_value
version: 2
playbook: inventory
description: >
  Average on-hand stock value per location and week (daily totals averaged, so weekly and daily snapshots compare). Rising value with no growth is cash tied up. Driver: the location's latest stock value.
archetypes:
  inv: inventory_snapshot
params:
  weeks: { type: integer, default: 20, minimum: 8, maximum: 52 }
sql: |
  select {{inv.location_name}} as entity,
         date_trunc('week', {{inv.snapshot_date}})::date as period_start,
         round(sum({{inv.on_hand_value}}) / nullif(count(distinct {{inv.snapshot_date}}), 0), 2) as value,
         count(distinct {{inv.item_id}}) as n
  from ({{inv}}) as inv
  where {{inv.snapshot_date}} > dateadd('week', -%(weeks)s, %(period_end)s::date)
    and {{inv.snapshot_date}} <= %(period_end)s::date
  group by 1, 2
  order by 1, 2
  limit %(row_cap)s
drivers:
  stock_value:
    exposure: null
    sql: |
      select {{inv.location_name}} as entity,
             round(sum({{inv.on_hand_value}}), 2) as stock_value
      from ({{inv}}) as inv
      where {{inv.snapshot_date}} > dateadd('day', -7, %(period_end)s::date)
        and {{inv.snapshot_date}} <= %(period_end)s::date
      group by 1
      order by 1
      limit %(row_cap)s
