key: freight_cost_per_unit
version: 1
playbook: purchasing
description: >
  Freight cost per unit ordered, per supplier and order week (landed cost pressure). Driver:
  units ordered from the supplier over the last 13 weeks (the volume the rise applies to).
archetypes:
  po: purchase_order
params:
  weeks: { type: integer, default: 26, minimum: 14, maximum: 104 }
sql: |
  select {{po.supplier_name}} as entity,
         date_trunc('week', {{po.ordered_at}})::date as period_start,
         round(sum({{po.freight_cost}}) / nullif(sum({{po.units_ordered}}), 0), 3) as value,
         count(*) as n
  from ({{po}}) as po
  where {{po.ordered_at}} > dateadd('week', -%(weeks)s, %(period_end)s::date)
    and {{po.ordered_at}} <= %(period_end)s::date
  group by 1, 2
  order by 1, 2
  limit %(row_cap)s
drivers:
  volume:
    exposure: units_13w
    sql: |
      select {{po.supplier_name}} as entity,
             sum({{po.units_ordered}}) as units_13w,
             count(*) as pos_13w,
             round(sum({{po.freight_cost}}), 2) as freight_13w
      from ({{po}}) as po
      where {{po.ordered_at}} > dateadd('week', -13, %(period_end)s::date)
        and {{po.ordered_at}} <= %(period_end)s::date
      group by 1
      order by 1
      limit %(row_cap)s
