key: supplier_lead_time
version: 1
playbook: purchasing
description: >
  Average days from order to receipt, per supplier and receipt week, over a trailing window.
  Driver: each supplier's open order exposure (lines, POs, SKUs, units still to receive).
archetypes:
  pol: purchase_order_line
params:
  weeks: { type: integer, default: 26, minimum: 14, maximum: 104 }
# Contract: entity, period_start, value[, n]. Placeholders: {{pol}} = mapped source,
# {{pol.<column>}} = mapped physical column. Bound params use %(name)s.
sql: |
  select {{pol.supplier_name}} as entity,
         date_trunc('week', {{pol.received_at}})::date as period_start,
         round(avg(datediff('day', {{pol.ordered_at}}, {{pol.received_at}})), 2) as value,
         count(*) as n
  from ({{pol}}) as pol
  where {{pol.received_at}} is not null
    and {{pol.received_at}} > dateadd('week', -%(weeks)s, %(period_end)s::date)
    and {{pol.received_at}} <= %(period_end)s::date
  group by 1, 2
  order by 1, 2
  limit %(row_cap)s
drivers:
  open_orders:
    exposure: open_lines
    sql: |
      select {{pol.supplier_name}} as entity,
             count(*) as open_lines,
             count(distinct {{pol.po_id}}) as open_pos,
             count(distinct {{pol.sku}}) as skus,
             sum({{pol.qty_ordered}}) as units_on_order
      from ({{pol}}) as pol
      where {{pol.received_at}} is null
        and {{pol.ordered_at}} <= %(period_end)s::date
      group by 1
      order by 1
      limit %(row_cap)s
