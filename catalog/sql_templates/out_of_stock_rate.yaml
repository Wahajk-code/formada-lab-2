key: out_of_stock_rate
version: 1
playbook: inventory
description: >
  Share of a store's item lines with nothing available to sell (available units at or below
  zero), per week (last snapshot of the week). A rate, so mixed units do not distort it. Rising
  means shelves are going empty. Driver: item lines the store carries now.
archetypes:
  inv: inventory_snapshot
params:
  weeks: { type: integer, default: 20, minimum: 14, maximum: 52 }
sql: |
  with week_end as (
    select date_trunc('week', {{inv.snapshot_date}})::date as week_start,
           max({{inv.snapshot_date}}) as snap
    from ({{inv}}) as inv
    where {{inv.snapshot_date}} > dateadd('week', -%(weeks)s, %(period_end)s::date)
      and {{inv.snapshot_date}} <= %(period_end)s::date
    group by 1
  )
  select {{inv.location_name}} as entity, w.week_start as period_start,
         round(100 * sum(case when {{inv.available_units}} <= 0 then 1 else 0 end)
               / nullif(count(*), 0), 2) as value,
         count(*) as n
  from ({{inv}}) as inv
  join week_end w on {{inv.snapshot_date}} = w.snap
  where {{inv.location_kind}} = 'store'
  group by 1, 2
  order by 1, 2
  limit %(row_cap)s
drivers:
  store_lines:
    exposure: item_lines
    sql: |
      with last_snap as (
        select max({{inv.snapshot_date}}) as snap
        from ({{inv}}) as inv
        where {{inv.snapshot_date}} <= %(period_end)s::date
      )
      select {{inv.location_name}} as entity, count(*) as item_lines,
             sum(case when {{inv.available_units}} <= 0 then 1 else 0 end) as empty_lines
      from ({{inv}}) as inv
      join last_snap l on {{inv.snapshot_date}} = l.snap
      where {{inv.location_kind}} = 'store'
      group by 1
      order by 1
      limit %(row_cap)s
