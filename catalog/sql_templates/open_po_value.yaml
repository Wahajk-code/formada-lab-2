key: open_po_value
version: 2
playbook: purchasing
description: >
  Money committed to purchase order lines not yet received, per supplier and order week. Old open value is cash waiting on a late supplier. Driver: the supplier's average weekly spend over 13 weeks.
archetypes:
  pl: purchase_order_line
params:
  weeks: { type: integer, default: 26, minimum: 14, maximum: 104 }
sql: |
  select {{pl.supplier_name}} as entity,
         date_trunc('week', {{pl.ordered_at}})::date as period_start,
         round(sum({{pl.unit_cost}} * greatest({{pl.qty_ordered}} - coalesce({{pl.qty_received}}, 0), 0)), 2) as value,
         count(*) as n
  from ({{pl}}) as pl
  where {{pl.ordered_at}} > dateadd('week', -%(weeks)s, %(period_end)s::date)
    and {{pl.ordered_at}} <= %(period_end)s::date
  group by 1, 2
  order by 1, 2
  limit %(row_cap)s
drivers:
  spend:
    exposure: null
    sql: |
      select {{pl.supplier_name}} as entity,
             round(sum({{pl.unit_cost}} * {{pl.qty_ordered}}) / 13, 2) as weekly_spend
      from ({{pl}}) as pl
      where {{pl.ordered_at}} > dateadd('week', -13, %(period_end)s::date)
        and {{pl.ordered_at}} <= %(period_end)s::date
      group by 1
      order by 1
      limit %(row_cap)s
