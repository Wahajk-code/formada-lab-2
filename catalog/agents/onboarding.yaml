          - coverage: each family (inventory, sales, returns, purchase_orders, receipts, transfers,
            vendors, customers, calendar) present, partial or missing, with evidence that quotes numbers.
            A family whose view fact was measured (dates, rows) is present or partial, never missing.
          - quality_issues: anything that would fool an analysis, with evidence (numbers), impact in plain
            words, and a handling the team can act on.
          - questions: only what the client alone can answer, each with why it matters.

          Plain language (a non-technical manager must be able to follow every line):
