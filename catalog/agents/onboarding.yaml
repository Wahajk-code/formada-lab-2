          anything you infer from names:
          - key_candidates: columns whose values never repeat.
          - joins: candidate joins that code TESTED (matched_pct, orphan_values, confirmed).
          - twin_tables: tables with almost the same columns (copies or back-fills).
          - semantic_views: models the customer already keeps in Snowflake: tables, dimensions,
