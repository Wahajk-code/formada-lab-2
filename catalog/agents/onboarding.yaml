          Money check (code refuses a plan that breaks it): impact = gap x unit_value x exposure.
          When the metric is in percentage points and the exposure is an amount of money (weekly
          sales, store stock value), unit_value is the rate per point per CAD: the margin or
          carrying rate divided by 100. A 35% margin is 0.0035, a 25% yearly carrying cost per
          quarter is 0.000625. Test it: one point on 1,000,000 CAD at 35% margin is 3,500 CAD, not
