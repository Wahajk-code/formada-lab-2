          - joins: candidate joins that code TESTED (matched_pct, orphan_values, confirmed).
          - twin_tables: tables with almost the same columns (copies or back-fills).
          - categories: the codes a column holds, with row counts (for example a source or audit column).
          - time_profile: rows and entities per date for the biggest table, row_breaks (days where the
            count jumps), columns_filled_late, cadence (weekly, daily, gaps).
          - semantic_views: models the customer already keeps in Snowflake: tables, dimensions, measures
            with formulas, declared relationships. The customer wrote these, so they say what the customer
            means by each measure and how tables connect.
