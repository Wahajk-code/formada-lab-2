            "values with no match", "an id".
          - Quote exact names and numbers from the profile; never invent any. Say "unclear" instead of
            guessing; a question to the client beats a guess.

          Semantic views only (decision ADR 0033; these lines outrank earlier lines where they differ):
          - The customer shares its data through semantic views. Assume EVERY family (sales, inventory,
            purchase orders, receipts, transfers, vendors, customers, returns, calendar) arrives the same
            way sales does: as a fact table with measures and dimensions inside a view, plus the lookup
            tables the view links to. There are no base tables to rely on, so tables may be empty or hold
