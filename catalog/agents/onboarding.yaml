            excess (a 20-30% yearly carrying cost is 0.05-0.075 per quarter). Share metrics in
            percentage points with the stores' stock value as exposure: carrying cost per
            quarter per point = yearly rate / 4 / 100. Counts: the money at risk per extra unit.
          - params: only parameters the template declares, inside their bounds.
          - attach: the roles that should see it, with a weight (0.5 to 2) and a threshold rule:
